name: Build & Commit VSIX (on main)

on:
  push:
    branches: [ hsbc/actions ]
    # Prevent infinite loops when the workflow commits the VSIX/version bump:
    paths-ignore:
      - 'artifacts/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write   # Needed to push commits back to the repo

jobs:
  build-vsix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      # Bump patch version: 1.0.2 -> 1.0.3 (no git tag)
      - name: Bump version (patch)
        run: |
          echo "Current version: $(node -p \"require('./package.json').version\")"
          npm version patch --no-git-tag-version
          echo "New version: $(node -p \"require('./package.json').version\")"

      - name: Install vsce
        run: npm i -g @vscode/vsce

      - name: Package VSIX
        run: vsce package

      - name: Upload VSIX to SharePoint
        env:
          TENANT_ID: ${{ secrets.SP_TENANT_ID }}
          CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.SP_CLIENT_SECRET }}
          SITE_ID: ${{ secrets.SP_SITE_ID }}
          DRIVE_ID: ${{ secrets.SP_DRIVE_ID }}
        run: |
          # Get Access Token
          TOKEN=$(curl -s -X POST -d "client_id=$CLIENT_ID&scope=https://graph.microsoft.com/.default&client_secret=$CLIENT_SECRET&grant_type=client_credentials" https://login.microsoftonline.com/$TENANT_ID/oauth2/v2.0/token | jq -r .access_token)

          # Get file name (assuming only 1 .vsix in artifacts)
          FILE=$(ls artifacts/*.vsix)

          # Upload file to SharePoint document library
          curl -X PUT -H "Authorization: Bearer $TOKEN" \
               -H "Content-Type: application/octet-stream" \
               --data-binary @"$FILE" \
               "https://graph.microsoft.com/v1.0/sites/$SITE_ID/drives/$DRIVE_ID/root:/${FILE##*/}:/content"


      - name: Move VSIX to artifacts folder
        run: |
          mkdir -p artifacts
          mv ./*.vsix artifacts/

      - name: Upload VSIX as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-build
          path: artifacts/*.vsix


      # Commit the new version + VSIX back to repo
      - name: Commit and push artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Force add in case *.vsix is ignored
          git add -f artifacts/*.vsix package.json package-lock.json
          git commit -m "chore: build VSIX and bump version [skip ci]" || echo "No changes to commit"
          git push
