name: Build & Commit VSIX

on:
  push:
    branches:
      - hsbc/actions
    paths-ignore:
      - 'artifacts/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  build-vsix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: hsbc/actions

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: genie-vscode
        run: npm ci

      - name: Set up Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Custom bump version
        working-directory: genie-vscode
        run: |
          version=$(node -p "require('./package.json').version")
          echo "🔹 Current version: $version"

          # Split version into parts
          IFS='.' read -r major minor patch <<< "$version"

          # Apply rollover logic for patch → minor
          if [ "$patch" -ge 9 ]; then
            patch=0
            minor=$((minor + 1))
          else
            patch=$((patch + 1))
          fi

          # Apply rollover logic for minor → major
          if [ "$minor" -ge 9 ]; then
            minor=0
            major=$((major + 1))
          fi

          new_version="$major.$minor.$patch"
          echo "🔹 New version: $new_version"

          npm version "$new_version" --no-git-tag-version
          git add package.json package-lock.json
          git commit -m "chore: bump version to $new_version [skip ci]" || echo "No changes"

      - name: Install vsce
        run: npm i -g @vscode/vsce

      - name: Package VSIX
        working-directory: genie-vscode
        run: vsce package

      - name: Move VSIX to artifacts folder
        run: |
          mkdir -p artifacts
          mv genie-vscode/*.vsix artifacts/
          ls -l artifacts

      - name: Upload VSIX as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-build
          path: artifacts/*.vsix

      - name: Commit VSIX + version bump
        run: |
          git add -f artifacts/*.vsix
          git commit -m "chore: add VSIX and bump version" || echo "No changes"

          # Sync and push
          git fetch origin hsbc/actions
          git pull --rebase origin hsbc/actions || true
          git push origin HEAD:hsbc/actions

      - name: Push VSIX to external repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone https://x-access-token:${{ secrets.PAT }}@github.com/revanthtrip748/VSIX-versions.git target-repo

          cp artifacts/*.vsix target-repo/

          cd target-repo
          git add *.vsix
          git commit -m "chore: add new VSIX build"
          git push origin main
