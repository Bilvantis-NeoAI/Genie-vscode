# Name of the GitHub Actions workflow
name: Build & Commit VSIX

on:
  push:
    branches:
      - hsbc/actions
    paths-ignore:
      - 'artifacts/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  build-vsix:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repo
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: hsbc/actions

      # Step 2: Node.js
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Step 3: Install dependencies
      - name: Install dependencies
        working-directory: genie-vscode
        run: npm ci

      # Step 4: Git identity
      - name: Set up Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Step 5: Install vsce
      - name: Install vsce
        run: npm i -g @vscode/vsce

      # Step 6: Package VSIX (uses current version in package.json)
      - name: Package VSIX
        working-directory: genie-vscode
        run: vsce package

      # Step 7: Move VSIX to artifacts folder
      - name: Move VSIX to artifacts folder
        run: |
          mkdir -p artifacts
          mv genie-vscode/*.vsix artifacts/
          ls -l artifacts

      # Step 8: Upload as workflow artifact
      - name: Upload VSIX as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-build
          path: artifacts/*.vsix

      # Step 9: Commit VSIX file(s) to repo
      - name: Commit VSIX
        run: |
          git add -f artifacts/*.vsix
          git commit -m "chore: add VSIX build" || echo "No changes"
          git fetch origin hsbc/actions
          git pull --rebase origin hsbc/actions || true
          git push origin HEAD:hsbc/actions

      # Step 10: Push latest VSIX to external repo, sorted by major.minor
      - name: Push latest VSIX to external repo (foldered)
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          echo "✅ Cloning external repo"
          git clone https://x-access-token:${{ secrets.PAT }}@github.com/revanthtrip748/VSIX-versions.git vsix-versions

          LATEST_FILE=$(ls -t artifacts/*.vsix | head -n1)
          echo "🔹 Latest VSIX: $LATEST_FILE"

          BASENAME=$(basename "$LATEST_FILE")
          VERSION=$(echo "$BASENAME" | grep -oP '\d+\.\d+\.\d+')
          MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1-2)

          echo "🔹 Version: $VERSION"
          echo "🔹 Major.Minor folder: $MAJOR_MINOR"

          TARGET_DIR="vsix-versions/vsix-files/$MAJOR_MINOR"
          mkdir -p "$TARGET_DIR"
          cp "$LATEST_FILE" "$TARGET_DIR/"

          cd vsix-versions
          git add "vsix-files/$MAJOR_MINOR/$BASENAME"
          if ! git diff --cached --quiet; then
            git commit -m "chore: add VSIX $BASENAME for version $VERSION"
            git push origin main
            echo "🚀 Pushed latest VSIX to external repo in folder $MAJOR_MINOR"
          else
            echo "ℹ️ No changes to commit"
          fi

      # Step 11: Bump version only AFTER success
      - name: Bump version for next build
        if: success()
        working-directory: genie-vscode
        run: |
          version=$(node -p "require('./package.json').version")
          echo "🔹 Current version: $version"

          IFS='.' read -r major minor patch <<< "$version"
          if [ "$patch" -ge 9 ]; then
            patch=0
            minor=$((minor + 1))
          else
            patch=$((patch + 1))
          fi
          if [ "$minor" -ge 9 ]; then
            minor=0
            major=$((major + 1))
          fi

          new_version="$major.$minor.$patch"
          echo "🔹 Next version: $new_version"

          npm version "$new_version" --no-git-tag-version
          git add package.json package-lock.json
          git commit -m "chore: bump version to $new_version [skip ci]" || echo "No changes"
          git push origin HEAD:hsbc/actions
