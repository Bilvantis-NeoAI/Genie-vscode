# Name of the GitHub Actions workflow
# Builds the VSIX, uploads it as a workflow artifact,
# pushes it to an external repo (sorted by version folders),
# and finally bumps the version for the next run.
name: Build & Commit VSIX

on:
  push:
    branches:
      - hsbc/poc/jp_08102025
    paths-ignore:          # Skip triggering if only these files change
      - 'artifacts/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write          # Needed for pushing commits back to this repo

jobs:
  build-vsix:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code from the hsbc/actions branch
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0   # Full history needed for version bump commits
          ref: hsbc/poc/jp_08102025
      - name: Log - Trigger start
        run: echo " GitHub Action triggered for branch hsbc/poc/jp_08102025"

      # Step 2: Set up Node.js 20 (required for building VS Code extensions)
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Log - Node.js setup
        run: echo " Node.js environment ready"

      # Step 3: Install dependencies inside extension folder
      - name: Install dependencies
        working-directory: genie-vscode
        run: npm ci
      - name: Log - Dependencies installed
        run: echo " Dependencies installed in genie-vscode"

      # Step 4: Configure Git user for commits made by this workflow
      - name: Set up Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Step 5: Install VSCE CLI (used to package the VS Code extension)
      - name: Install vsce
        run: npm i -g @vscode/vsce
      - name: Log - VSCE installed
        run: echo "VSCE CLI installed"

      # Step 6: Package the extension into a .vsix (uses version in package.json)
      - name: Package VSIX
        working-directory: genie-vscode
        run: |
          echo "Starting VSIX packaging..."
          vsce package
          echo "VSIX packaging is done"

      # Step 7: Move generated VSIX file(s) into the vsix_package_versions/ folder inside the repo
      - name: Move VSIX to vsix_package_versions folder
        run: |
          mkdir -p genie-vscode/vsix_package_versions
          mv genie-vscode/*.vsix genie-vscode/vsix_package_versions/
          ls -l genie-vscode/vsix_package_versions   # List files for debugging
          echo "VSIX moved to genie-vscode/vsix_package_versions/"

      # Step 8: Upload the VSIX file(s) as workflow artifacts
      # (these are downloadable directly from the Actions UI)
      # - name: Upload VSIX as workflow artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: vsix-build
      #     path: artifacts/*.vsix

      # Step 9: Commit the VSIX file(s) to this repo (hsbc/actions branch)
      # - name: Commit VSIX
      #   run: |
      #     git add -f artifacts/*.vsix       # Force add even if .gitignore blocks binaries
      #     git commit -m "chore: add VSIX build" || echo "No changes"
      #     git fetch origin hsbc/poc/arch_repo
      #     git pull --rebase origin hsbc/poc/arch_repo || true
      #     git push origin HEAD:hsbc/poc/arch_repo

      # Step 10a: Commit VSIX into this repo under genie-vscode/vsix_package_versions/
      - name: Commit VSIX to this repo
        run: |
          git add genie-vscode/vsix_package_versions/*.vsix
          if ! git diff --cached --quiet; then
            git commit -m "chore: add VSIX package(s) to vsix_package_versions"
            git push origin HEAD:hsbc/poc/jp_08102025
            echo "Pushed VSIX to this repo under genie-vscode/vsix_package_versions/"
          else
            echo "No new VSIX to commit in this repo"
          fi

      # Step 10b: Push latest VSIX to external repo (flat into vsix_build_files)
      - name: Push latest VSIX to external repo
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          echo "Cloning external repo"
          git clone https://x-access-token:${{ secrets.PAT1 }}@github.com/Jagannath173/vsix_version.git vsix-versions
          cd vsix-versions

          TARGET_DIR="vsix_build_files"
          mkdir -p "$TARGET_DIR"

          echo "Copying latest VSIX from source repo"
          cp ../genie-vscode/vsix_package_versions/*.vsix "$TARGET_DIR/"
          ls -l "$TARGET_DIR"
      
          # Add this check for empty repo
          if [ -z "$(git rev-parse --quiet --verify HEAD)" ]; then
            git checkout -b main
          fi
      
          git add "$TARGET_DIR"/*.vsix
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: add VSIX $(basename ../genie-vscode/vsix_package_versions/*.vsix)"
            # First push to empty repo needs -u
            git push -u origin main
            echo "Pushed latest VSIX to external repo (vsix_build_files)"
          else
            echo "No changes to commit in external repo"
          fi


      # Step 11: Bump version for the next build, but ONLY if everything succeeded
      - name: Bump version for next build
        if: success()
        working-directory: genie-vscode
        run: |
          version=$(node -p "require('./package.json').version")
          echo "🔹 Current version: $version"

          # Split version into major.minor.patch
          IFS='.' read -r major minor patch <<< "$version"

          # Increment patch (roll over to minor/major if needed)
          if [ "$patch" -ge 9 ]; then
            patch=0
            minor=$((minor + 1))
          else
            patch=$((patch + 1))
          fi
          if [ "$minor" -ge 9 ]; then
            minor=0
            major=$((major + 1))
          fi

          # Construct new version
          new_version="$major.$minor.$patch"
          echo "🔹 Next version: $new_version"

          # Update package.json + package-lock.json, commit, and push
          npm version "$new_version" --no-git-tag-version
          git add package.json package-lock.json
          git commit -m "chore: bump version to $new_version [skip ci]" || echo "No changes"
          git push origin HEAD:hsbc/poc/jp_08102025
