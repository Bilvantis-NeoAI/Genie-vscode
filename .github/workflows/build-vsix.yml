name: Build & Commit VSIX

on:
  push:
    branches:
      - hsbc/actions
    paths-ignore:
      - 'artifacts/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  build-vsix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: hsbc/actions

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: genie-vscode
        run: npm ci

      - name: Bump version (patch)
        working-directory: genie-vscode
        run: |
          echo "🔹 Current version: $(node -p "require('./package.json').version")"
          npm version patch -m "chore: bump version to %s [skip ci]"

      - name: Commit bumped version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add genie-vscode/package.json genie-vscode/package-lock.json
          git commit -m "chore: bump version [skip ci]" || echo "No changes to commit"

      - name: Sync with remote
        run: |
          git fetch origin hsbc/actions
          git rebase origin/hsbc/actions || git merge --ff-only origin/hsbc/actions

      - name: Push bumped version
        run: git push origin HEAD:hsbc/actions

      - name: Install vsce
        run: npm i -g @vscode/vsce

      - name: Package VSIX
        working-directory: genie-vscode
        run: vsce package

      - name: Move VSIX to artifacts folder
        run: |
          mkdir -p artifacts
          mv genie-vscode/*.vsix artifacts/
          ls -l artifacts

      - name: Upload VSIX as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-build
          path: artifacts/*.vsix

          # ✅ Commit the VSIX into THIS repo on hsbc/actions
      - name: Commit VSIX into this repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # force-add in case .gitignore ignores binaries
          git add -f artifacts/*.vsix genie-vscode/package.json genie-vscode/package-lock.json

          git commit -m "chore: add VSIX and bump version" || echo "No changes to commit"

          # make sure we’re up to date, then push once
          git fetch origin hsbc/actions
          git pull --rebase origin hsbc/actions || true
          git push origin HEAD:hsbc/actions

      # ✅ New Step: Push VSIX to another repository
      - name: Push VSIX to external repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # clone target repo with PAT secret
          git clone https://x-access-token:${{ secrets.PAT }}@github.com/revanthtrip748/VSIX-versions.git target-repo

          cp artifacts/*.vsix target-repo/

          cd target-repo
          git add *.vsix
          git commit -m "chore: add new VSIX build"
          git push origin main

